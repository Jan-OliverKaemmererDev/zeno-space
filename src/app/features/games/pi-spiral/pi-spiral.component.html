<div class="pi-spiral-wrapper" role="application" aria-label="Pi Spiral Horizon – Mathematische Mosaik-Meditation">
  <!-- Hidden Font Preload Probe ensuring Orbitron is resident in DOM FontFaceSet -->
  <span class="orbitron-font-probe" aria-hidden="true">3,14 0123456789</span>

  <!-- Interactive 3D WebGL Canvas Container -->
  <div 
    #canvasContainer
    class="canvas-container"
    role="img"
    aria-label="3D-Ansicht der Pi-Spirale mit schwebenden Pastell-Mosaiksteinen"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp($event)"
    (pointercancel)="onPointerUp($event)"
    (pointerleave)="onPointerLeave()"
    (wheel)="onWheel($event)"
    (dblclick)="onDoubleClick()"
  ></div>

  <!-- Top Glass HUD Header with Speech Bubble -->
  <app-pi-spiral-header
    [currentPiSnippet]="currentPiSnippet()"
    [totalDecimalsFormatted]="totalDecimalsFormatted()"
    [generatedPiDecimals]="generatedPiDecimalsAfter14()"
    [showBubble]="showPiBubble()"
    [closingBubble]="closingPiBubble()"
    (toggleBubble)="togglePiBubble($event)"
    (closeBubble)="closePiBubble()"
  ></app-pi-spiral-header>

  <!-- Bottom Floating Control Dock -->
  <app-pi-spiral-controls
    [isAutoFlowActive]="isAutoFlowActive()"
    [isSoundEnabled]="isSoundEnabled()"
    (addDigits)="addFiveDigits()"
    (toggleAutoFlow)="toggleAutoFlow()"
    (resetCamera)="resetCameraView()"
    (toggleSound)="toggleSound()"
    (resetSpiral)="resetSpiral()"
  ></app-pi-spiral-controls>
</div>
