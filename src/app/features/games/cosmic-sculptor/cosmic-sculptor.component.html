<div class="cosmic-wrapper" role="application" aria-label="Cosmic Sculptor – Fotorealistisches Planetensystem & Harfensaiten-Orbits">
  <!-- Interactive 3D WebGL Canvas Container -->
  <div 
    #canvasContainer 
    class="three-canvas-container"
    role="img"
    aria-label="3D Ansicht des Sonnensystems mit schwingenden Harfen-Umlaufbahnen"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp($event)"
    (pointercancel)="onPointerUp($event)"
    (pointerleave)="onPointerLeave()"
    (wheel)="onWheel($event)"
    (dblclick)="onDoubleClick()"
  ></div>

  <!-- Top Glass HUD Header with Info Bubble -->
  <app-cosmic-header
    [planetCount]="planetCount()"
    [blackHoleCount]="blackHoleCount()"
    [collisionCount]="collisionCount()"
    [systemStability]="systemStability()"
    [showBubble]="showInfoBubble()"
    [closingBubble]="closingInfoBubble()"
    (toggleBubble)="toggleInfoBubble($event)"
    (closeBubble)="closeInfoBubble()"
  ></app-cosmic-header>

  <!-- Bottom Floating Glass Control Dock -->
  <app-cosmic-controls
    [timeSpeed]="timeSpeed()"
    [orbitStringsVisible]="orbitStringsVisible()"
    (spawnPlanet)="onSpawnPlanet()"
    (spawnBlackHole)="onSpawnBlackHole()"
    (setSpeed)="setTimeSpeed($event)"
    (toggleOrbitStrings)="toggleOrbitStrings()"
    (resetCamera)="resetCameraView()"
    (resetSystem)="resetCosmos()"
  ></app-cosmic-controls>
</div>
