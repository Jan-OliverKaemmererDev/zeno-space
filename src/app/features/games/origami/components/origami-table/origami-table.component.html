<div class="origami-desktop-surface" role="main" aria-label="Origami Tisch – Vogelperspektive">
  <!-- Desk Background Wood Grain Overlay & Sakura Petals -->
  <app-origami-desk-ambient />

  <!-- Center Stage: The Table Workspace -->
  <div class="table-center">
    @if (!state.selectedPattern()) {
      <!-- Empty Desk State (Waiting for Motif) -->
      <app-origami-empty-table />
    } @else {
      <!-- Active 3D Origami Workspace -->
      <div class="paper-stage" [class.is-completed]="state.isCompleted()">
        <!-- Full 3D Interactive Three.js Viewport: Freely floating over the desk -->
        <div class="origami-3d-stage" role="region" aria-label="3D Origami Faltansicht">
          <!-- Active Animal Badge Tag -->
          @switch (state.selectedPattern()?.id) {
            @case ('crane') { <app-origami-crane /> }
            @case ('owl') { <app-origami-owl /> }
            @case ('turtle') { <app-origami-turtle /> }
          }

          <!-- WebGL Canvas: Hold down mouse button to rotate model around itself -->
          <canvas
            #origamiCanvas
            class="origami-3d-canvas"
            [class.is-dragging]="isDragging()"
            (pointerdown)="onPointerDown($event)"
            (pointermove)="onPointerMove($event)"
            (pointerup)="onPointerUp($event)"
            (pointercancel)="onPointerUp($event)"
            (wheel)="onWheel($event)"
          ></canvas>

          <!-- 3D Viewport Controls: Circular Crosshair Reticle Button -->
          <div class="stage-hud-overlay" aria-hidden="true">
            <button
              type="button"
              class="hud-btn-circle reset-view-btn"
              (click)="resetView()"
              title="3D-Ansicht auf Ausgangswinkel zentrieren"
              aria-label="3D-Ansicht zentrieren"
            >
              <svg
                class="crosshair-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <!-- Custom Crosshair / Fadenkreuz Reticle -->
                <circle cx="12" cy="12" r="7" stroke-width="1.8" />
                <circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none" />
                <line x1="12" y1="1.5" x2="12" y2="5" />
                <line x1="12" y1="19" x2="12" y2="22.5" />
                <line x1="1.5" y1="12" x2="5" y2="12" />
                <line x1="19" y1="12" x2="22.5" y2="12" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Folding Instruction Pill directly under the Paper -->
        <app-origami-step-instruction />
      </div>
    }
  </div>
</div>
