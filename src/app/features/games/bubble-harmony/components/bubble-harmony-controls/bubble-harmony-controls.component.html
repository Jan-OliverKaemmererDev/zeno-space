<div class="game-controls-dock">
  <div class="dock-panel" role="toolbar" aria-label="Seifenblasen-Steuerung">
    <!-- Spawn Cluster -->
    <button 
      type="button" 
      class="dock-btn dock-btn--primary"
      (click)="spawnCluster.emit()"
      aria-label="Blasen-Schwarm erzeugen"
      title="Blasen-Schwarm erzeugen (Shortcut: Leertaste)"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="9" cy="14" r="5" />
        <circle cx="16" cy="9" r="3.5" />
        <circle cx="6" cy="7" r="2" />
      </svg>
      <span>Blasen-Schwarm</span>
    </button>

    <div class="dock-divider" aria-hidden="true"></div>

    <!-- Chain Reaction Toggle -->
    <button 
      type="button" 
      class="dock-btn dock-btn--secondary"
      [class.active]="chainReaction"
      [attr.aria-pressed]="chainReaction"
      (click)="toggleChain.emit()"
      aria-label="Kettenreaktion {{ chainReaction ? 'deaktivieren' : 'aktivieren' }}"
      title="Kettenreaktion umschalten"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
      </svg>
      <span>Kettenreaktion: {{ chainReaction ? 'An' : 'Aus' }}</span>
    </button>

    <!-- Symphony Pop -->
    <button 
      type="button" 
      class="dock-btn dock-btn--ghost"
      (click)="popAllSymphony.emit()"
      aria-label="Klang-Symphonie abspielen – Alle Blasen platzen lassen"
      title="Klang-Symphonie abspielen"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 18V5l12-2v13" />
        <circle cx="6" cy="18" r="3" />
        <circle cx="18" cy="16" r="3" />
      </svg>
      <span>Klang-Symphonie</span>
    </button>

    <div class="dock-divider" aria-hidden="true"></div>

    <!-- Werkzeug Pill Component -->
    <app-bubble-tool-selector
      [activeTool]="activeTool"
      [showToolBubble]="showToolBubble"
      [closingToolBubble]="closingToolBubble"
      (toggleToolBubble)="onToggleToolBubble($event)"
      (selectTool)="onSelectTool($event)"
      (closeToolBubble)="onCloseToolBubble()"
    ></app-bubble-tool-selector>
  </div>

  <!-- Instruction Hint Component -->
  <app-bubble-instruction-hint
    [activeToolHint]="activeToolHint"
  ></app-bubble-instruction-hint>
</div>
