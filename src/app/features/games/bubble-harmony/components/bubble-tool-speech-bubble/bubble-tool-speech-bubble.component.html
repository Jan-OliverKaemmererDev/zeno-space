<div 
  class="speech-bubble tool-speech-bubble" 
  [class.is-closing]="isClosing" 
  (click)="$event.stopPropagation()"
  (pointerdown)="$event.stopPropagation()"
  (pointerup)="$event.stopPropagation()"
  (wheel)="onBubbleWheel($event)"
  role="dialog"
  aria-label="Werkzeug auswählen"
>
  <div class="bubble-header">
    <div class="bubble-title-group">
      <span class="bubble-tool-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
        </svg>
      </span>
      <h4>Werkzeuge</h4>
    </div>
    <div class="bubble-header-actions">
      <button 
        type="button" 
        class="bubble-close-btn" 
        (click)="handleClose($event)" 
        aria-label="Schließen"
        title="Schließen"
      >×</button>
    </div>
  </div>

  <div class="bubble-body" tabindex="0" role="region" aria-label="Werkzeugliste">
    <div class="tools-grid">
      <!-- Option: Deaktivieren / Kein Werkzeug -->
      <button
        type="button"
        class="tool-card tool-card--none"
        [class.is-active]="activeToolId === null"
        (click)="onToolClick(null, $event)"
        [attr.aria-pressed]="activeToolId === null"
        title="Kein Werkzeug (Normaler Modus)"
      >
        <div class="tool-card-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
          </svg>
        </div>
        <div class="tool-card-content">
          <div class="tool-card-header">
            <span class="tool-card-title">Kein Werkzeug</span>
            @if (activeToolId === null) {
              <span class="active-badge">Aktiv</span>
            }
          </div>
          <span class="tool-card-tagline">Klassisches Seifenblasen-Spiel</span>
          <p class="tool-card-desc">Keine Spezialeffekte. Normales Platzen per Klick und Pusten durch Halten.</p>
        </div>
      </button>

      @for (tool of tools; track tool.id) {
        <button
          type="button"
          class="tool-card"
          [class.is-active]="tool.id === activeToolId"
          (click)="onToolClick(tool.id, $event)"
          [attr.aria-pressed]="tool.id === activeToolId"
          title="{{ tool.label }} auswählen"
        >
          <div class="tool-card-icon" aria-hidden="true">
            @switch (tool.id) {
              @case ('fan') {
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 12c-2-2.5-5-2-6.5-.5S4 16 6.5 16s4-2 5.5-4z"/>
                  <path d="M12 12c2.5-2 2-5 .5-6.5S8 4 8 6.5s2 4 4 5.5z"/>
                  <path d="M12 12c2 2.5 5 2 6.5.5S20 8 17.5 8s-4 2-5.5 4z"/>
                  <path d="M12 12c-2.5 2-2 5-.5 6.5S16 20 16 17.5s-2-4-4-5.5z"/>
                  <circle cx="12" cy="12" r="2"/>
                </svg>
              }
              @case ('magnet') {
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m6 15-3-3 6.7-6.7a5.5 5.5 0 0 1 7.8 7.8L12 18"/>
                  <path d="m9 18 3 3 4.5-4.5"/>
                  <path d="m4.5 10.5 3 3"/>
                  <path d="m15 4.5 3 3"/>
                </svg>
              }
              @case ('prism') {
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/>
                </svg>
              }
              @case ('chime') {
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
                  <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
                </svg>
              }
            }
          </div>

          <div class="tool-card-content">
            <div class="tool-card-header">
              <span class="tool-card-title">{{ tool.label }}</span>
              @if (tool.id === activeToolId) {
                <span class="active-badge">Aktiv</span>
              }
            </div>
            <span class="tool-card-tagline">{{ tool.tagline }}</span>
            <p class="tool-card-desc">{{ tool.description }}</p>
          </div>
        </button>
      }
    </div>
  </div>
</div>
