<div class="bubble-harmony-wrapper" role="application" aria-label="Bubble Harmony – Interaktive Seifenblasen">
  <!-- Interactive Canvas -->
  <canvas 
    #canvasRef
    class="bubble-canvas"
    role="img"
    aria-label="Interaktive Seifenblasen-Simulation"
    (mousedown)="onPointerDown($event)"
    (mousemove)="onPointerMove($event)"
    (mouseup)="onPointerUp()"
    (touchstart)="onPointerDown($event)"
    (touchmove)="onPointerMove($event)"
    (touchend)="onPointerUp()"
  ></canvas>

  <!-- Top Glass HUD -->
  <header class="game-hud-header">
    <a routerLink="/" class="back-link" aria-label="Zurück zur Startseite">
      <span class="back-icon" aria-hidden="true">←</span>
      <span>Zurück zu den Seifenblasen</span>
    </a>

    <div class="hud-stats" aria-live="polite">
      <div class="stat-bubble">
        <span class="stat-num">{{ bubbleCount() }}</span>
        <span class="stat-text">Schwebend</span>
      </div>
      <div class="stat-bubble">
        <span class="stat-num">{{ poppedTotal() }}</span>
        <span class="stat-text">Geplatzt</span>
      </div>
    </div>
  </header>

  <!-- Bottom Floating Control Dock -->
  <div class="game-controls-dock">
    <div class="dock-panel" role="toolbar" aria-label="Seifenblasen-Steuerung">
      <!-- Spawn Cluster -->
      <button 
        type="button" 
        class="dock-btn dock-btn--primary"
        (click)="spawnBubbleCluster()"
        aria-label="Blasen-Schwarm erzeugen"
        title="Blasen-Schwarm erzeugen"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="14" r="5" />
          <circle cx="16" cy="9" r="3.5" />
          <circle cx="6" cy="7" r="2" />
        </svg>
        <span>Blasen-Schwarm</span>
      </button>

      <div class="dock-divider" aria-hidden="true"></div>

      <!-- Chain Reaction Toggle -->
      <button 
        type="button" 
        class="dock-btn dock-btn--secondary"
        [class.active]="chainReaction()"
        [attr.aria-pressed]="chainReaction()"
        (click)="toggleChain()"
        aria-label="Kettenreaktion {{ chainReaction() ? 'deaktivieren' : 'aktivieren' }}"
        title="Kettenreaktion umschalten"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
        </svg>
        <span>Kettenreaktion: {{ chainReaction() ? 'An' : 'Aus' }}</span>
      </button>

      <!-- Symphony Pop -->
      <button 
        type="button" 
        class="dock-btn dock-btn--ghost"
        (click)="popAllSymphony()"
        aria-label="Klang-Symphonie abspielen – Alle Blasen platzen lassen"
        title="Klang-Symphonie abspielen"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 18V5l12-2v13" />
          <circle cx="6" cy="18" r="3" />
          <circle cx="18" cy="16" r="3" />
        </svg>
        <span>Klang-Symphonie</span>
      </button>
    </div>

    <!-- Instruction Hint -->
    <aside class="interaction-hint" aria-label="Bedienungshinweise">
      <span class="hint-item">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 18h6"/>
          <path d="M10 22h4"/>
          <path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/>
        </svg>
        <span>Klicke eine Blase zum Platzen & Hören</span>
      </span>
      <span aria-hidden="true">•</span>
      <span>Gedrückt halten zum Pusten neuer Blasen</span>
      <span aria-hidden="true">•</span>
      <span>ESC: Zurück zur Startseite</span>
    </aside>
  </div>
</div>
