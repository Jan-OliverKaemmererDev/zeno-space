<div class="bubble-harmony-wrapper" role="application" aria-label="Bubble Harmony – Interaktive Seifenblasen">
  <!-- Interactive 2D Canvas Simulation Component -->
  <app-bubble-canvas
    #canvasComp
    [activeTool]="activeTool()"
    [chainReaction]="chainReaction()"
    (bubbleCountChange)="bubbleCount.set($event)"
    (bubblePopped)="onBubblePopped()"
  ></app-bubble-canvas>

  <!-- Top Glass HUD Header -->
  <app-bubble-harmony-header
    [bubbleCount]="bubbleCount()"
    [poppedTotal]="poppedTotal()"
  ></app-bubble-harmony-header>

  <!-- Bottom Floating Control Dock -->
  <app-bubble-harmony-controls
    [chainReaction]="chainReaction()"
    [activeTool]="activeTool()"
    [activeToolHint]="activeToolHint()"
    [showToolBubble]="showToolBubble()"
    [closingToolBubble]="closingToolBubble()"
    (spawnCluster)="spawnBubbleCluster()"
    (toggleChain)="toggleChain()"
    (popAllSymphony)="popAllSymphony()"
    (toggleToolBubble)="toggleToolBubble($event)"
    (selectTool)="onSelectTool($event)"
    (closeToolBubble)="closeToolBubble()"
  ></app-bubble-harmony-controls>
</div>
