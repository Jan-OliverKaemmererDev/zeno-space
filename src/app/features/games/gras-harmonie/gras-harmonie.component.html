<div class="gras-wrapper" role="application" aria-label="Gras-Harmonie – Interaktive Wind- & Gras-Oase">
  <!-- Interactive 3D Canvas Simulation Component -->
  <app-gras-canvas
    #canvasComp
    [timeOfDay]="timeOfDay()"
    [windPreset]="windPreset()"
    (windSpeedChange)="windSpeedDisplay.set($event)"
  ></app-gras-canvas>

  <!-- Top Glass HUD Header -->
  <app-gras-harmonie-header
    [isMuted]="isMuted()"
    (toggleSound)="toggleSound()"
  ></app-gras-harmonie-header>

  <!-- Right Side Celestial Time & Atmosphere Tray -->
  <app-gras-celestial-tray
    [timeOfDay]="timeOfDay()"
    (timeOfDayChange)="setTimeOfDay($event)"
  ></app-gras-celestial-tray>

  <!-- Bottom Floating Glass Control Dock -->
  <app-gras-controls-dock
    [windPreset]="windPreset()"
    (windPresetChange)="setWindPreset($event)"
    (windGust)="triggerWindGust()"
  ></app-gras-controls-dock>
</div>
