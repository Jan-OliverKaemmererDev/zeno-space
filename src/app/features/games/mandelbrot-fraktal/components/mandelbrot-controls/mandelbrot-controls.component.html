<nav class="game-controls-dock" aria-label="Mandelbrot-Steuerung">
  <!-- Waypoints Flyout Menu -->
  @if (showWaypointMenu()) {
    <div 
      class="waypoints-flyout" 
      role="menu" 
      aria-label="Auswahl legendärer Mandelbrot-Orte"
      (click)="$event.stopPropagation()"
    >
      <div class="flyout-header">
        <h5>Legendäre Fraktal-Orte</h5>
        <button 
          type="button" 
          class="flyout-close" 
          (click)="closeWaypointMenu()"
          aria-label="Menü schließen"
        >×</button>
      </div>
      <div class="flyout-list">
        @for (wp of waypoints; track wp.id) {
          <button 
            type="button" 
            class="waypoint-item"
            [class.active]="wp.id === currentWaypointId"
            (click)="onSelectWaypoint(wp, $event)"
          >
            <div class="wp-title">{{ wp.name }}</div>
            <div class="wp-sub">{{ wp.subtitle }}</div>
          </button>
        }
      </div>
    </div>
  }

  <div class="dock-panel" role="toolbar" aria-label="Fraktal-Aktionen">
    <!-- Action: Zoom In (Primary) -->
    <button 
      type="button" 
      class="dock-btn dock-btn--primary"
      (click)="zoomIn.emit()"
      aria-label="In das Fraktal hineinzoomen"
      title="Hineinzoomen (Shortcut: Leertaste oder Pfeil hoch)"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        <line x1="11" y1="8" x2="11" y2="14"/>
        <line x1="8" y1="11" x2="14" y2="11"/>
      </svg>
      <span>+ Zoom</span>
    </button>

    <!-- Toggle: Waypoints Dropdown -->
    <button 
      type="button" 
      class="dock-btn dock-btn--secondary"
      [class.active]="showWaypointMenu()"
      (click)="toggleWaypointMenu($event)"
      aria-label="Legendäre Orte der Mandelbrot-Menge wählen"
      title="Orte anspringen"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
      </svg>
      <span>Orte</span>
    </button>

    <!-- Toggle: Sound Chimes -->
    <button 
      type="button" 
      class="dock-btn dock-btn--secondary"
      [class.active]="isSoundEnabled"
      [attr.aria-pressed]="isSoundEnabled"
      (click)="toggleSound.emit()"
      aria-label="Sphärenklänge an- oder ausschalten"
      title="Klang an/aus"
    >
      @if (isSoundEnabled) {
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
      } @else {
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <line x1="23" y1="9" x2="17" y2="15"/>
          <line x1="17" y1="9" x2="23" y2="15"/>
        </svg>
      }
      <span>Klang</span>
    </button>

    <div class="dock-divider" aria-hidden="true"></div>

    <!-- Action: Reset View -->
    <button 
      type="button" 
      class="dock-btn dock-btn--ghost"
      (click)="resetView.emit()"
      aria-label="Fraktal auf Gesamtübersicht zurücksetzen und generierte Ressourcen leeren"
      title="Neustart (Shortcut: R)"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
      <span>Neustart</span>
    </button>
  </div>

  <!-- Instruction Hint -->
  <aside class="interaction-hint" aria-label="Bedienungshinweise">
    <span class="hint-item">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7"/>
        <rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/>
        <rect x="3" y="14" width="7" height="7"/>
      </svg>
      <span>WASD : Bewegen</span>
    </span>
    <span aria-hidden="true">•</span>
    <span>Mausrad : Zoom auf Mauszeiger</span>
    <span aria-hidden="true">•</span>
    <span>↑↓ : Zoomen</span>
    <span aria-hidden="true">•</span>
    <span>ESC : Menü</span>
  </aside>
</nav>
