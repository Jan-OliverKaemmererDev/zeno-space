<div class="landing-container">
  <!-- Living WebGL Procedural Anime Cloud Canvas -->
  <app-cloud-canvas></app-cloud-canvas>

  <!-- Content Body receiving the elastic rubber-band transform -->
  <div #scrollBody class="landing-scroll-body">
    <!-- Hero Section -->
    <app-hero-section (scrollDown)="scrollToHub()"></app-hero-section>

    <!-- Mini-Game Hub Section -->
    <app-bubble-hub-section></app-bubble-hub-section>

    <!-- Cozy Sanctuary Section -->
    <app-sanctuary-section 
      [isRevealed]="isSanctuaryRevealed()" 
      [isInView]="isInSanctuaryView()"
    ></app-sanctuary-section>
  </div>

  <!-- Hex-Orb Seifenblasen Navigation -->
  <app-orb-nav
    [activeIndex]="activeSectionIndex()"
    [sections]="sections"
    (sectionSelect)="scrollToSection($event)"
  ></app-orb-nav>
</div>
