<div 
  class="game-instructions-backdrop" 
  [class.is-closing]="isClosing()"
  (click)="onBackdropClick($event)"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="game.title + ' – Spiel-Vorschau und Steuerung'"
>
  <div 
    #cardRef
    class="game-instructions-card"
    [style.--game-color]="game.primaryColor"
    [style.--game-glow]="game.glowColor"
    (click)="$event.stopPropagation()"
  >
    <!-- Ambient glowing backdrop effect & frosted glass reflection sheen -->
    <div class="card-glow" aria-hidden="true"></div>
    <div class="card-glass-sheen" aria-hidden="true"></div>

    <!-- Header: Title & Close Button in First Row -->
    <app-game-instructions-header
      [title]="game.title"
      (close)="handleClose()"
    ></app-game-instructions-header>

    <!-- Main Content: Subtitle & Description -->
    <app-game-instructions-intro
      [subtitle]="game.subtitle"
      [description]="game.description"
      [objective]="game.controls?.objective"
    ></app-game-instructions-intro>

    <!-- Controls Section: Only relevant keys & mouse inputs -->
    <div class="game-instructions-controls">
      <h3 class="controls-heading">
        <span class="controls-pill">Steuerung</span>
      </h3>

      <div class="controls-grid">
        <!-- 1. Keyboard Controls (Only shown if keyboard is configured) -->
        @if (game.controls?.keyboard && game.controls!.keyboard!.length > 0) {
          <app-game-instructions-keyboard
            [controls]="game.controls!.keyboard!"
          ></app-game-instructions-keyboard>
        }

        <!-- 2. Mouse Controls (Only shown if mouse is configured) -->
        @if (game.controls?.mouse) {
          <app-game-instructions-mouse
            [mouse]="game.controls!.mouse!"
          ></app-game-instructions-mouse>
        }
      </div>
    </div>

    <!-- Footer: Primary "Spiel starten" Button on Bottom Right -->
    <app-game-instructions-footer
      [gameTitle]="game.title"
      (startGame)="handleStartGame()"
    ></app-game-instructions-footer>
  </div>
</div>
