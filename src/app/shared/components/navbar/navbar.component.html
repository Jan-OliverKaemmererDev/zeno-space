<header class="navbar-wrapper" [class.is-visible]="isVisible()">
  <nav class="navbar">
    <!-- Brand Logo (No Orb, 'Interaktive Welten' Subtitle) -->
    <a routerLink="/" class="brand" title="Zur Startseite">
      <div class="brand-text">
        <span class="brand-title">zeno<span class="brand-accent">.space</span></span>
        <span class="brand-tag">Interaktive Welten</span>
      </div>
    </a>

    <!-- Center: 3D Käserad of Worlds (Drag & Rotate in 3D) -->
    <div 
      #wheelViewport
      class="wheel-viewport"
      title="Ziehen zum Drehen des Weltenrads"
    >
      <!-- Käserad Horizon Glow Disc -->
      <div class="wheel-disc-ambient"></div>

      <!-- 3D Rotating Cylinder -->
      <div #wheelCylinder class="wheel-cylinder">
        @for (slot of tireSlots(); track $index; let i = $index) {
          <div 
            class="wheel-item"
            [class.is-active]="activeSlotIndex() === i"
            (click)="activeSlotIndex() === i ? onSlotClick($event, slot, i) : null"
          >
            <div class="world-capsule">
              <span class="world-name">{{ slot.title }}</span>
            </div>
          </div>
        }
      </div>

      <!-- Käserad Outer Blur Lenses: Blurs the receding edges of flanking pills -->
      <div class="wheel-edge-blur wheel-edge-blur--left"></div>
      <div class="wheel-edge-blur wheel-edge-blur--right"></div>
    </div>

    <!-- Right: Minimalist Sound Toggle Icon -->
    <div class="nav-actions">
      <button 
        type="button" 
        class="nav-sound-toggle"
        [class.is-playing]="!audioService.isMuted()" 
        (click)="onToggleAudio()"
        [attr.aria-label]="audioService.isMuted() ? 'Sound aktivieren' : 'Sound stummschalten'"
        [title]="audioService.isMuted() ? 'Sound aktivieren (Space Ambient)' : 'Sound stummschalten (Space Ambient läuft)'"
      >
        @if (!audioService.isMuted()) {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
          </svg>
        } @else {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
            <line x1="23" y1="9" x2="17" y2="15" />
            <line x1="17" y1="9" x2="23" y2="15" />
          </svg>
        }
      </button>
    </div>
  </nav>
</header>
