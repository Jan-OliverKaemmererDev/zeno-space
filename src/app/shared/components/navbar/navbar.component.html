<header class="navbar-wrapper" [class.is-visible]="isVisible() || isDropdownClosing()" [class.is-menu-open]="isDropdownOpen() || isDropdownClosing()">
  <nav class="navbar" [class.is-menu-open]="isDropdownOpen() || isDropdownClosing()">
    <!-- Brand Logo -->
    <app-navbar-brand (brandClick)="closeDropdown()"></app-navbar-brand>

    <!-- Center: Interactive Origami Crane & Unfolding Kategorien-Portal -->
    <div class="crane-nav-center">
      <app-origami-crane
        [flightState]="flightState()"
        [isFlapping]="isFlapping()"
        [isOpen]="isDropdownOpen()"
        [selectedCategory]="selectedCategory()"
        (toggle)="toggleDropdown()"
      ></app-origami-crane>

      <app-category-dropdown
        [isOpen]="isDropdownOpen()"
        [isClosing]="isDropdownClosing()"
        [categories]="categories"
        [selectedCategory]="selectedCategory()"
        (categorySelect)="onCategoryClick($event)"
        (resetCategoryFilter)="resetCategory($event)"
      ></app-category-dropdown>
    </div>

    <!-- Right: Sound Activation Experience (Orbit Particles, Cosmic Beacon & Toggle) -->
    <app-navbar-sound
      [isBursting]="isBursting()"
      [burstSparks]="burstSparks()"
      [soundTooltipLetters]="soundTooltipLetters"
      [orbitParticleIndices]="orbitParticleIndices"
      (toggleAudio)="onToggleAudio()"
    ></app-navbar-sound>
  </nav>
</header>
