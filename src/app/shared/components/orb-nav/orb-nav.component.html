<nav 
  class="orb-3d-container"
  [class.is-idle]="isIdle()"
  [class.is-waking]="isWaking()"
  role="navigation"
  aria-label="3D Pixel-Orbs Navigation"
  (pointermove)="onPointerMove($event)"
  (pointerleave)="onPointerLeave()"
>
  <!-- Glassmorphic Plate Tray Background (Dezent & Transparent) -->
  <app-orb-tray></app-orb-tray>

  <!-- Three.js 3D WebGL Canvas -->
  <app-orb-canvas
    #canvasComponent
    [activeIndex]="activeIndex()"
    [isIdle]="isIdle()"
    (hoveredOrbChange)="activeHoverIndex.set($event)"
  ></app-orb-canvas>

  <!-- Interactive Target Anchors for Accessibility, Tooltips & Clicks -->
  <app-orb-targets
    [sections]="sections()"
    [activeIndex]="activeIndex()"
    [activeHoverIndex]="activeHoverIndex()"
    (orbSelect)="onOrbClick($event)"
    (orbPointerDown)="onOrbPointerDown()"
  ></app-orb-targets>
</nav>
