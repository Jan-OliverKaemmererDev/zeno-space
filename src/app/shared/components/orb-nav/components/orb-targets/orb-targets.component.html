<div class="orb-targets-overlay">
  @for (sec of sections(); track sec.id; let idx = $index) {
    <div 
      class="orb-target-zone" 
      [class.is-active]="activeIndex() === idx"
      [style.top.px]="orbCenterY[idx]"
    >
      <button
        type="button"
        [id]="'orb-target-' + idx"
        class="orb-target-btn"
        [class.is-active]="activeIndex() === idx"
        [class.is-hovered]="activeHoverIndex() === idx"
        [attr.tabindex]="activeIndex() === idx ? 0 : -1"
        (keydown)="onOrbKeydown($event, idx)"
        (pointerdown)="orbPointerDown.emit()"
        (click)="onOrbClick(idx)"
        [attr.aria-label]="'Zu Abschnitt ' + sec.label + ' springen'"
        [attr.aria-current]="activeIndex() === idx ? 'true' : null"
      >
        <span class="sr-only">{{ sec.label }}</span>
      </button>

      <!-- Tooltip (Transparent background, Sniglet bubble font & Laola wave) -->
      <span 
        class="orb-tooltip" 
        [class.is-visible]="activeHoverIndex() === idx"
        aria-hidden="true"
      >
        @for (letter of getTooltipLetters(sec.label); track $index) {
          <span 
            class="tooltip-letter-carrier" 
            [style.--char-from-right]="letter.fromRight"
          >
            <span class="tooltip-letter">{{ letter.char }}</span>
          </span>
        }
      </span>

      <!-- Subtle Click Sparks: 2 or 3 pixels shoot out and extinguish -->
      @for (spark of getSparksForOrb(idx); track spark.id) {
        <span 
          class="orb-click-spark"
          [style.--sx.px]="spark.startX"
          [style.--sy.px]="spark.startY"
          [style.--ex.px]="spark.endX"
          [style.--ey.px]="spark.endY"
          [style.width.px]="spark.size"
          [style.height.px]="spark.size"
          [style.background-color]="spark.color"
          aria-hidden="true"
        ></span>
      }
    </div>
  }
</div>
