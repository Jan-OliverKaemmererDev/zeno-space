<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Cosmic Aura Filter -->
    <filter id="zenoGlow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" />
    </filter>

    <!-- Outer Ambient Glow Radial Gradient -->
    <radialGradient id="ambientHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.25" />
      <stop offset="85%" stop-color="#818cf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Cosmic Bubble 3D Glass Body Gradient -->
    <radialGradient id="planetBody" cx="36%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="22%" stop-color="#7dd3fc" />
      <stop offset="48%" stop-color="#38bdf8" />
      <stop offset="76%" stop-color="#818cf8" />
      <stop offset="94%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#67e8f9" />
    </radialGradient>

    <!-- Inner Core Starlight Glow -->
    <radialGradient id="coreGlow" cx="42%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#bae6fd" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Celestial Ring Gradient -->
    <linearGradient id="ringGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.7" />
      <stop offset="25%" stop-color="#bae6fd" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="75%" stop-color="#7dd3fc" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.7" />
    </linearGradient>

    <!-- Celestial Ring Glow Gradient -->
    <linearGradient id="ringGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glass Specular Highlight Gradient (Crescent Sheen) -->
    <linearGradient id="sheenGradient" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Bottom Rim Refraction Highlight -->
    <linearGradient id="bottomRimGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Inner Galaxy Swirl Track Gradient -->
    <linearGradient id="swirlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="40%" stop-color="#bae6fd" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#c084fc" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- 1. Ambient Background Halo -->
  <circle cx="32" cy="32" r="28" fill="url(#ambientHalo)" />

  <!-- 2. Back Celestial Ring (Tilted at -22°, behind sphere) -->
  <g transform="rotate(-22 32 32)">
    <!-- Glow -->
    <path d="M 6,32 A 26 7.5 0 0 1 58,32" fill="none" stroke="url(#ringGlowGrad)" stroke-width="4.5" stroke-linecap="round" opacity="0.4" filter="url(#softBlur)" />
    <!-- Core line -->
    <path d="M 6,32 A 26 7.5 0 0 1 58,32" fill="none" stroke="url(#ringGradient)" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  </g>

  <!-- 3. Main Cosmic Glass Sphere -->
  <g filter="url(#zenoGlow)">
    <circle cx="32" cy="32" r="16.5" fill="url(#planetBody)" />
  </g>

  <!-- 4. Inner Starlight Core & Galaxy Swirl inside the Sphere -->
  <circle cx="31" cy="31" r="10" fill="url(#coreGlow)" />
  <ellipse cx="32" cy="33" rx="10.5" ry="4" transform="rotate(-22 32 33)" fill="none" stroke="url(#swirlGrad)" stroke-width="1.8" opacity="0.65" stroke-dasharray="16 3 8 4" />

  <!-- Inner Stardust Specks -->
  <circle cx="28" cy="31.5" r="0.75" fill="#ffffff" opacity="0.9" />
  <circle cx="34" cy="33.5" r="0.65" fill="#ffffff" opacity="0.85" />
  <circle cx="31" cy="28.5" r="0.5" fill="#e0f2fe" opacity="0.75" />
  <circle cx="36" cy="30" r="0.55" fill="#bae6fd" opacity="0.7" />
  <circle cx="25" cy="33" r="0.45" fill="#ffffff" opacity="0.6" />

  <!-- 5. Glass Specular Highlights (Bubble Sheen) -->
  <!-- Upper-Left Crescent Curve -->
  <path d="M 21,21 C 24.5,17.5 31,17 35.5,18.5 C 32,20.2 26.5,21.5 22.5,25 C 21.8,23.8 21.2,22.4 21,21 Z" fill="url(#sheenGradient)" />
  <!-- Gloss Spot -->
  <ellipse cx="25.5" cy="22.5" rx="3.5" ry="1.8" transform="rotate(-30 25.5 22.5)" fill="#ffffff" opacity="0.8" />
  <!-- Bottom Rim Refraction -->
  <path d="M 23,43 C 27.5,46.5 36.5,46.5 41,43 C 38,44.8 29.5,45.2 23,43 Z" fill="url(#bottomRimGrad)" />

  <!-- 6. Front Celestial Ring (passing in front of the sphere) -->
  <g transform="rotate(-22 32 32)">
    <!-- Ambient Ring Glow -->
    <path d="M 58,32 A 26 7.5 0 0 1 6,32" fill="none" stroke="url(#ringGlowGrad)" stroke-width="5" stroke-linecap="round" opacity="0.55" filter="url(#softBlur)" />
    <!-- Crisp Outer Ring Ribbon -->
    <path d="M 58,32 A 26 7.5 0 0 1 6,32" fill="none" stroke="url(#ringGradient)" stroke-width="2.2" stroke-linecap="round" />
    <!-- Bright Center Highlight along the Ring -->
    <path d="M 44,38.8 A 26 7.5 0 0 1 18,38.2" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.95" />
  </g>

  <!-- 7. Cosmic Stardust on the Front Ring -->
  <circle cx="22" cy="40.5" r="0.9" fill="#ffffff" />
  <circle cx="25" cy="41.8" r="0.55" fill="#bae6fd" />
  <circle cx="39" cy="40" r="0.85" fill="#ffffff" />
  <circle cx="43.5" cy="38.5" r="0.6" fill="#e0f2fe" />
  <circle cx="16" cy="37.5" r="0.7" fill="#ffffff" opacity="0.9" />

  <!-- 8. Surrounding Starlight Sparkles -->
  <!-- Primary Sparkle Star (Top Right) -->
  <g transform="translate(48, 14)">
    <path d="M 0,-5.5 Q 0,0 -5.5,0 Q 0,0 0,5.5 Q 0,0 5.5,0 Q 0,0 0,-5.5 Z" fill="#ffffff" />
    <circle cx="0" cy="0" r="1.2" fill="#7dd3fc" />
  </g>

  <!-- Secondary Micro Sparkle (Bottom Left) -->
  <g transform="translate(13, 48)">
    <path d="M 0,-3.5 Q 0,0 -3.5,0 Q 0,0 0,3.5 Q 0,0 3.5,0 Q 0,0 0,-3.5 Z" fill="#bae6fd" opacity="0.9" />
  </g>

  <!-- Distant Twinkling Star (Top Left) -->
  <circle cx="15" cy="14" r="0.8" fill="#ffffff" opacity="0.85" />
  <!-- Distant Twinkling Star (Bottom Right) -->
  <circle cx="51" cy="48" r="0.75" fill="#bae6fd" opacity="0.8" />
</svg>
